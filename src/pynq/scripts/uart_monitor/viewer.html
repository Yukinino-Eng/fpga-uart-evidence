const labels={'temperature_limit':'温度持续越限','status_fault':'设备状态位异常','valid_frame_timeout':'通信中断：未收到有效帧','protocol:crc_errors':'报文校验失败','protocol:sequence_missing':'报文序号缺失','protocol:duplicates':'收到重复报文','protocol:interframe_noise':'帧间异常字节','protocol:header_errors':'报文头格式错误','protocol:semantic_errors':'报文字段不合法','protocol:restart_or_out_of_order':'设备重启或报文乱序','local:fifo_overflow':'采集端缓存溢出','local:event_fifo_overflow':'告警缓存溢出','local:parser_overflow':'解析端数据积压丢失','local:framing_error':'采集端停止位错误','device_fault':'设备上报故障','imu_invalid':'IMU 数据无效','imu_stale':'IMU 数据过期','sender_skipped':'设备遥测曾跳发'};
const names={'temperature_mdeg':'温度','voltage_mv':'电压','pitch_mdeg':'车身倾角','rate_mdps':'角速度','sequence':'序号','uptime_ms':'设备运行时间','encoder_e1':'编码器 E1','encoder_e2':'编码器 E2','pwm_a_counts':'A路 PWM','pwm_b_counts':'B路 PWM','status':'状态位','flags':'标志位','imu_age_ms':'IMU 数据年龄','fault_code':'故障码'};
const title=e=>faultName(e), sec=t=>(t-data.origin)/1e8;
const escNum=x=>Number.isFinite(x)?x.toFixed(3):'—';
function fieldLabel(name){const meta=data.fields.find(f=>f.name===name)||{};return meta.label&&meta.label!==name?meta.label:names[name]||name}
function ruleFor(e){return (data.rules||[]).find(r=>r.id===e.rule_id)}

function conditionText(e){const a=annotation(e);if(a.detail)return a.detail;if(isNotice(e))return '在收到第一帧之前等待数据，作为通信提示保留。';const r=ruleFor(e),v=e.evidence||{},meta=r?(data.fields.find(f=>f.name===r.field)||{}):{},unit=meta.unit?' '+meta.unit:'';if(r){let value=v.value===null||v.value===undefined?'无效':String(v.value)+unit;if(r.kind==='range')return '触发值 '+value+'；允许范围 '+r.min+' ～ '+r.max+unit;if(r.kind==='invalid')return '该字段缺失或无效，未按0处理。';if(r.kind==='bits')return '状态位符合配置的告警条件；触发值 '+value;return '触发值 '+value+'；条件：'+faultName(e)}if(e.rule_id==='valid_frame_timeout')return '超过 '+Math.round(data.gap_seconds*1000)+' ms 未收到有效帧。';if(e.rule_id==='protocol:sequence_missing')return '检测到缺失 '+(v.count===undefined?'未知数量的':v.count)+' 帧。';return ({'protocol:crc_errors':'报文校验不一致，保留原始错误字节。','protocol:duplicates':'检测到重复的报文序号。','protocol:interframe_noise':'两帧之间存在异常字节，原始数据已保留。','protocol:header_errors':'包头或固定格式不符合当前协议。','local:fifo_overflow':'采集端缓存已满；此项不归因于被测设备。','local:framing_error':'接收端检测到停止位错误。'})[e.rule_id]||'依据当前协议与检测规则生成记录。'}

function sameTimeText(e){const n=data.events.filter(x=>!isNotice(x)&&x.trigger_ticks===e.trigger_ticks).length;return n>1?'同一时刻共 '+n+' 条规则命中':''}

function renderRecords(){const box=$('events'),scroll=box.scrollTop;box.replaceChildren();let count=0;for(const item of data.events){if(!visibleEvent(item))continue;count++;const b=document.createElement('button'),line=document.createElement('div'),id=document.createElement('span'),kind=document.createElement('span'),heading=document.createElement('strong'),time=document.createElement('span'),reason=document.createElement('span'),state=document.createElement('span');const notice=isNotice(item),saved=savedState(item);b.className='event'+(String(item.event_id)===selected?' selected':'');b.dataset.eventId=item.event_id;b.setAttribute('aria-pressed',String(String(item.event_id)===selected));line.className='record-line';id.textContent='记录 '+String(item.event_id).padStart(3,'0');kind.className='record-kind'+(notice?' note':'');kind.textContent=notice?'通信提示':({device:'字段故障',protocol:'通信异常',capture:'采集异常'})[item.category]||'故障记录';line.append(id,kind);heading.textContent=title(item);time.className='trigger-time';time.textContent='触发时间：'+triggerTime(item);reason.className='record-reason';reason.textContent=conditionText(item);state.className='record-status'+(saved.warn?' warn':'');state.textContent=[repeatText(item),saved.text,sameTimeText(item)].filter(Boolean).join(' · ');b.append(line,heading,time,reason,state);b.onclick=()=>chooseEvent(item.event_id);box.appendChild(b)}if(!count)box.textContent=$('event-filter').value==='notes'?'暂无通信提示':'暂无符合条件的故障记录';box.scrollTop=scroll;if(focusRecord){const button=box.querySelector('.selected');if(button)box.scrollTop=Math.max(0,button.offsetTop-12);focusRecord=false}}

function kv(id,items){let e=$(id);e.replaceChildren();for(let [k,v] of items){let a=document.createElement('span'),b=document.createElement('span');a.textContent=k;b.textContent=String(v);e.append(a,b)}}
function event(){return data.events.find(e=>String(e.event_id)===selected)}
function bounds(frames){return frames.length?[sec(frames[0].start_ticks),sec(frames[frames.length-1].end_ticks)]:[0,1]}
function chooseEvent(id){selected=String(id);pinned=false;follow=false;let e=event(),w=data.windows[selected];if(!e)return;if(e.evidence&&data.fields.some(f=>f.name===e.evidence.field)){field=e.evidence.field;$('field').value=field}let r=w?w.manifest:null;range=r?[sec(r.covered_start_ticks),sec(r.covered_end_ticks)]:[sec(e.trigger_ticks)-5,sec(e.trigger_ticks)+5];render()}
function renderBase(){
 let report=data.report||{},status=data.status||{},parser=report.parser||status.parser||{};
 $('record').textContent=data.record_label||data.profile_label||data.name;$('mode').textContent=data.live?'实时监测 · 只读可视化':'实板记录 · 离线浏览';

 $('viewcount').textContent=data.catching_up?'视图正在追赶记录…':data.view_limited?'仅显示最近视图，完整数据保留在记录中':'已读取 '+data.frames.length+' 帧';

if(holder)setInterval(async()=>{if(updatingNotebook)return;updatingNotebook=true;try{const node=parent.document.getElementById(holder),text=node&&node.textContent;if(text&&text!==signature){const next=await decodeNotebook(text);accept(next);signature=text}if(data.live&&performance.now()-acceptedAt>3500){$('current-state').textContent='状态更新延迟';$('state-note').textContent='请检查Notebook内核，不据此判断设备故障'}}catch(error){$('footer').textContent='实时视图更新失败：'+error.message}finally{updatingNotebook=false}},250);
</script></html>
